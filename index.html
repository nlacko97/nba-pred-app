<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F3EEE3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F0E0C" media="(prefers-color-scheme: dark)">
  <title>NBA Predictor — The Pick Sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Big+Shoulders+Display:wght@600;700;800;900&family=Permanent+Marker&display=swap"
    rel="stylesheet">
  <script>
    // Apply the saved theme before first paint to avoid a light/dark flash
    try {
      var scheme = localStorage.getItem('vueuse-color-scheme')
      if (scheme === 'dark' || ((!scheme || scheme === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      }
    } catch (e) { }
  </script>
  <script src="https://accounts.google.com/gsi/client"></script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>

</body>

</html>
